<header class="chat-header">
  <h1 id="chat-title">{{ current.display_title }}</h1>
  <details>
    <summary class="icon-button" aria-label="Chat options">
      <svg class="icon" aria-hidden="true"><use href="#i-more"/></svg>
    </summary>
    <div class="menu-panel">
      <form method="post" action="{% url 'rename' current.pk %}">
        {% csrf_token %}
        <label for="id_title" class="small muted">Rename</label>
        <div class="inline-form">
          <input type="text" name="title" id="id_title" value="{{ current.title }}" maxlength="120" required>
          <button type="submit" class="button button-small">Save</button>
        </div>
      </form>
      <form method="get" action="{% url 'delete' current.pk %}">
        <button type="submit" class="button button-small button-danger">Delete chat…</button>
      </form>
    </div>
  </details>
</header>
